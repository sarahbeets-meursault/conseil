name: Mise à jour des statistiques Mailchimp

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les statistiques
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python scripts/fetch_mailchimp.py
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/campaigns.json
          git diff --cached --quiet || git commit -m "Statistiques Mailchimp du $(date +%d/%m/%Y)"
          git push
